<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zeitwinkel — The Observatory</title>
<meta name="description" content="Zeitwinkel. Independent Swiss watch manufacture. Saint-Imier. 100 watches per year. Explore the constellation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300;0,7..72,400;0,7..72,500;1,7..72,400&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Loader -->
<div id="loader">
  <div class="loader-dot"></div>
  <div class="loader-ring"></div>
  <div class="loader-label">
    <span class="loader-line">Aligning the stars</span>
    <span class="loader-sub">Saint-Imier, Bernese Jura</span>
  </div>
</div>

<!-- Custom cursor / telescope -->
<div id="cursor" aria-hidden="true">
  <div class="cursor-glow"></div>
  <div class="cursor-ring"></div>
  <div class="cursor-dot"></div>
</div>

<!-- Constellation lines SVG -->
<svg id="constellation" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <filter id="line-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Watch loop -->
  <path class="constellation-line" d="" data-loop="watch" fill="none" stroke="#B8B0A8" stroke-width="0.08" opacity="0"/>
  <!-- Story loop -->
  <path class="constellation-line" d="" data-loop="story" fill="none" stroke="#B8B0A8" stroke-width="0.06" opacity="0"/>
</svg>

<!-- Background stars (tiny dots, generated by JS) -->
<div id="stardust" aria-hidden="true"></div>

<!-- The sky -->
<div id="sky">

  <!-- Core star: Zeitwinkel -->
  <div class="star core" data-id="zeitwinkel" style="left:50%;top:50%;"
       data-detail="Founded 2006 in Saint-Imier, Bernese Jura. Three friends, still independent, still managing the company they started together. The time angle.">
    <span class="star-label">Zeitwinkel</span>
    <span class="star-glow"></span>
  </div>

  <!-- Watch stars -->
  <div class="star watch" data-id="saphir173" style="left:72%;top:28%;"
       data-detail="173° Saphir. 39.7 mm. Sapphire crystal. In-house caliber. A modern classic with a sapphire case back revealing the movement.">
    <span class="star-label">173°</span>
    <span class="star-glow"></span>
  </div>

  <div class="star watch" data-id="saphir273" style="left:78%;top:52%;"
       data-detail="273° Saphir. 42.5 mm. Available in Fumé and Bleu. The flagship model with a sapphire crystal exhibition back.">
    <span class="star-label">273°</span>
    <span class="star-glow"></span>
  </div>

  <div class="star watch" data-id="model240" style="left:68%;top:76%;"
       data-detail="240°. 40.5 mm. A pure expression of modern classic design. Clean dial, elegant proportions.">
    <span class="star-label">240°</span>
    <span class="star-glow"></span>
  </div>

  <div class="star watch" data-id="email082" style="left:32%;top:76%;"
       data-detail="082° Email Grand Feu. 39 mm. A Grand Feu enamel dial, fired at over 800 degrees Celsius. Each dial is unique.">
    <span class="star-label">082°</span>
    <span class="star-glow"></span>
  </div>

  <div class="star watch" data-id="maks188" style="left:22%;top:52%;"
       data-detail="188° MAKS. 39 mm. A limited edition celebrating the art of watchmaking. Distinctive aesthetics, in-house movement.">
    <span class="star-label">188°</span>
    <span class="star-glow"></span>
  </div>

  <!-- Story stars -->
  <div class="star story" data-id="saintimier" style="left:82%;top:18%;"
       data-detail="Saint-Imier, Bernese Jura. The heart of Swiss watchmaking since the 18th century. Home of Zeitwinkel since 2006.">
    <span class="star-label">Saint-Imier</span>
    <span class="star-glow"></span>
  </div>

  <div class="star story" data-id="germansilver" style="left:88%;top:42%;"
       data-detail="German Silver. Untreated nickel silver. Harder than brass. Warmer than steel. The plates and bridges of every Zeitwinkel movement require the highest precision.">
    <span class="star-label">German Silver</span>
    <span class="star-glow"></span>
  </div>

  <div class="star story" data-id="movement" style="left:84%;top:68%;"
       data-detail="Caliber ZW0102 & ZW0103. In-house manufacture movements. 72-hour power reserve. 28 jewels. 257 components. Developed and assembled in the Swiss Jura.">
    <span class="star-label">The Movement</span>
    <span class="star-glow"></span>
  </div>

  <div class="star story" data-id="philosophy" style="left:16%;top:68%;"
       data-detail="True Local Time. We believe watchmaking is a craft worth preserving. No shortcuts. No simplifications. Each watch a true measure of time.">
    <span class="star-label">True Local Time</span>
    <span class="star-glow"></span>
  </div>

  <div class="star story" data-id="hundred" style="left:12%;top:42%;"
       data-detail="One hundred. No more than one hundred watches are completed each year. Each assembled, regulated and tested by hand. The same watchmaker from first component to first heartbeat.">
    <span class="star-label">100</span>
    <span class="star-glow"></span>
  </div>

  <div class="star story" data-id="friends" style="left:18%;top:18%;"
       data-detail="Three friends. Founded in 2006. Still there. Still independent. Still managing the company they started together in Saint-Imier.">
    <span class="star-label">Three Friends</span>
    <span class="star-glow"></span>
  </div>

  <!-- Dim stars -->
  <div class="star dim" data-id="power" style="left:50%;top:88%;"
       data-detail="72 hours of power reserve. Three full days of autonomy. A robust three-quarter plate.">
    <span class="star-label">72h</span>
  </div>

  <div class="star dim" data-id="jewels" style="left:50%;top:12%;"
       data-detail="28 jewels. Synthetic ruby bearings reduce friction at every pivot point.">
    <span class="star-label">28</span>
  </div>

  <div class="star dim" data-id="components" style="left:90%;top:88%;"
       data-detail="257 components. Each one finished, assembled and regulated by hand.">
    <span class="star-label">257</span>
  </div>

</div>

<!-- Detail panel -->
<div id="detail-panel" aria-hidden="true">
  <div class="detail-inner">
    <h3 class="detail-title"></h3>
    <p class="detail-body"></p>
    <button class="detail-close" aria-label="Close">×</button>
  </div>
</div>

<!-- Hint -->
<div id="hint">Move to explore. Click to reveal.</div>

<!-- Corner marks -->
<div class="mark" id="mark-tl">Zeitwinkel</div>
<div class="mark" id="mark-tr">Saint-Imier</div>
<div class="mark" id="mark-bl">Independent Swiss Manufacture</div>
<div class="mark" id="mark-br">100 per year</div>

<script src="script.js"></script>
</body>
</html>
